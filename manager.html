<script>
const ENV_CONFIG = {
  prod: {
    LINE_AUTH_URL: 'https://eomsdvwklntrtiiksnro.supabase.co/functions/v1/line-auth'
  },
  staging: {
    LINE_AUTH_URL: 'https://lxptelyviuucqmwxqxly.supabase.co/functions/v1/line-auth'
  },
  dev: {
    LINE_AUTH_URL: 'https://lxptelyviuucqmwxqxly.supabase.co/functions/v1/line-auth'
  }
};

function detectEnvironment() {
  const host = (typeof window !== 'undefined' && window.location && window.location.hostname) || '';
  if (host === 'app.edgeops.jp') return 'prod';
  if (host.includes('staging') || host === 'staging.edgeops.jp') return 'staging';
  if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local')) return 'dev';
  // 不明なホストは安全側で prod にフォールバック
  return 'prod';
}

const CURRENT_ENV = detectEnvironment();
const LINE_AUTH_URL = ENV_CONFIG[CURRENT_ENV].LINE_AUTH_URL;

console.log('[EdgeOps manager] Environment:', CURRENT_ENV, '| hostname:', window.location.hostname);
</script>

<div id="screen-loading" class="screen active">
  <div class="mg-state">
    <div class="mg-spinner" aria-hidden="true"></div>
    <div class="mg-state-title">起動中です</div>
    <p class="mg-state-text">認証と施設管理者判定を確認しています。</p>
  </div>
</div>

<div id="screen-denied" class="screen">
  <div class="mg-state">
    <div class="mg-state-title">権限がありません</div>
    <p class="mg-state-text">施設管理者として登録されているアカウントでご利用ください。</p>
    <button type="button" id="manager-logout-denied-btn" class="mg-state-action" onclick="managerLogout()">別のアカウントでログイン</button>
    <button type="button" id="back-to-edgeops-denied" class="mg-state-back" onclick="backToEdgeOps()" hidden>EdgeOpsへ戻る</button>
  </div>
</div>

<div id="screen-main" class="screen">
  <div class="mg-shell">
    <header class="mg-header">
      <h1 class="mg-title">EdgeOps 施設管理</h1>
      <div class="mg-header-actions">
        <button type="button" id="back-to-edgeops" class="mg-back" onclick="backToEdgeOps()" hidden>EdgeOpsへ戻る</button>
        <button type="button" id="manager-logout-btn" class="mg-logout" onclick="managerLogout()">ログアウト</button>
      </div>
    </header>
    <main class="mg-content">
      <div id="facility-banner" class="mg-banner" hidden></div>
      <section class="mg-card">
        <label class="mg-label" for="facility-select">施設切替</label>
        <select id="facility-select" class="mg-select"></select>
        <dl class="mg-details">
          <div class="mg-detail">
            <dt class="mg-detail-term">施設名</dt>
            <dd id="facility-name" class="mg-detail-value"></dd>
          </div>
          <div class="mg-detail">
            <dt class="mg-detail-term">施設コード</dt>
            <dd id="facility-code" class="mg-detail-value"></dd>
          </div>
          <div class="mg-detail">
            <dt class="mg-detail-term">プラン</dt>
            <dd id="facility-plan" class="mg-detail-value"></dd>
          </div>
          <div class="mg-detail">
            <dt class="mg-detail-term">契約ステータス</dt>
            <dd id="facility-contract-status" class="mg-detail-value"></dd>
          </div>
          <div class="mg-detail">
            <dt class="mg-detail-term">サブステータス</dt>
            <dd id="facility-sub-status" class="mg-detail-value"></dd>
          </div>
        </dl>
        <div class="mg-actions-reserved" aria-hidden="true">
          <!-- [EO-DEC-0235〜0238] 施設写真登録UI -->
          <section id="facility-photo-section" style="margin-top:16px;">
            <div style="font-size:11px; font-weight:700; color:#666; margin-bottom:8px; letter-spacing:0.5px;">施設写真</div>
            <label for="facility-photo-input" style="display:inline-block; padding:8px 16px; background:var(--mg-accent,#0f1e35); color:#fff; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600;">
              写真を選択
            </label>
            <input id="facility-photo-input" type="file" accept="image/jpeg" style="display:none;">
            <!-- 登録前プレビュー（実際のEOIDカードと同じ見た目） -->
            <div id="facility-photo-preview-wrap" class="eo-idcard" style="display:none; margin-top:12px; position:relative; overflow:hidden; border-radius:6px; border:1px solid #ddd; padding:20px; text-align:center; min-height:80px; background:#fff;">
              <div id="facility-photo-preview-bg" class="eo-idcard__photo"></div>
              <div class="eo-idcard__veil"></div>
              <div style="position:relative; z-index:2; font-size:12px; color:#666;">このような見た目で登録されます</div>
            </div>
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              <button id="facility-photo-upload-btn" type="button"
                style="padding:8px 16px; background:var(--mg-accent,#0f1e35); color:#fff; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; display:none;"
                onclick="facilityPhotoUpload()">登録する</button>
              <button id="facility-photo-delete-btn" type="button"
                style="padding:8px 16px; background:#fff; color:#c0392b; border:1.5px solid #c0392b; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;"
                onclick="facilityPhotoDelete()">削除する</button>
            </div>
            <div id="facility-photo-msg" style="font-size:12px; margin-top:6px; min-height:16px;"></div>
          </section>
        </div>
      </section>
      <div class="mg-stat-grid">

//   「!== 'suspended'」と書くと NULL と将来の未知の値（cancel_scheduled・ended）が素通りする。
// ★第253回で cancel_scheduled を実装したら、この配列にだけ足す。
//   DB側（manager_create_group の ARRAY['active']）と対で直すこと。
const FACILITY_ACTIVE_CONTRACT_STATUSES = ['active'];

// ★画面に出す理由の文言。帯とボタンの両方がこの1つを見る（同じ文を2箇所に書き写さない）。
const FACILITY_INACTIVE_MESSAGE = 'この施設は現在利用開始前または利用停止中です。グループを作成できません。';

// ★契約状態の判定はこの関数1つだけ。帯の出し分けとグループ作成ボタンの無効化が両方これを見る。
// ★契約状態を取得できていないとき（RPC失敗・facility 未取得）は「制限しない」を既定とする。
//   制御されない経路でボタンが永久に押せなくなることを避けるため（原則77）。
function isFacilityContractActive(facility) {
  const status = facility && facility.contract_status;
  if (status == null || String(status) === '') return true;
  return FACILITY_ACTIVE_CONTRACT_STATUSES.indexOf(String(status)) !== -1;
}

// ★グループ作成の導線だけを無効化する。他の管理操作のボタンには触れない。

function applyGroupCreateGuard() {
  const button = document.getElementById('group-create-entry-btn');
  if (!button) return;
  const blocked = !isFacilityContractActive(getSelectedFacility());
  button.disabled = blocked;
  button.title = blocked ? FACILITY_INACTIVE_MESSAGE : '';
}

function generateGroupId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const part1 = Array.from({length:5}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  const part2 = Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  return `SL-${part1}-${part2}`;
}

function setGroupSectionButtonsDisabled(disabled) {
  const section = document.getElementById('group-list-container');
  if (!section) return;
  section.querySelectorAll('button').forEach((button) => {
    button.disabled = disabled;

  if (!disabled) applyGroupCreateGuard();
}

function getGroupOwnerCandidates(group) {
  const targetFacilityId = String(selectedFacilityId || '');
  const targetGroupName = String(group.group_name || '');
  return memberCandidates.filter((candidate) => {
    if (!candidate || String(candidate.out_facility_id) !== targetFacilityId) return false;
    if (!candidate.out_eo_uid) return false;
    const groupNames = Array.isArray(candidate.out_group_names) ? candidate.out_group_names : [];
    return targetGroupName !== '' && groupNames.includes(targetGroupName);
  });
}

async function reloadManagerDataStrict() {

  const { data: groupData, error: groupError } = await sb.rpc('manager_list_groups');

// ── [EO-DEC-0258] ST版グループのPlus版移行 ──────────────────────

//   認証・作成者確認・施設管理者確認・20件上限・二重移行防止はすべてRPC側が持つ。
//   ここで行うのは「弾かれるものを最初から見せない」ことだけである。
// [EO-DEC-0259] 施設管理者の一覧（facility_managers を正とする専用RPCから取る）
let facilityManagers = [];

// ★[EO-DEC-0259] 施設管理者の表示名を決める。
//   ①facility_managers.display_name ②この施設のグループでの表示名 ③他のグループでの表示名
//   のうち、最初に見つかったものを使う。どれも無ければ「（名前なし）」。
function managerDisplayName(mgr) {
  if (!mgr) return '（名前なし）';
  const own = String(mgr.out_display_name || '').trim();
  if (own) return own;
  const sameFacility = memberCandidates.find(
    (c) => String(c.out_facility_id) === String(mgr.out_facility_id)
        && c.out_eo_uid === mgr.out_eo_uid
  );
  const anyFacility = sameFacility || memberCandidates.find((c) => c.out_eo_uid === mgr.out_eo_uid);
  const names = anyFacility && Array.isArray(anyFacility.out_display_names)
    ? anyFacility.out_display_names.filter((n) => String(n || '').trim())
    : [];
  return names.join(' / ') || '（名前なし）';
}

let migratableGroups = [];
let migrateRunning = false;
// [EO-DEC-0258 追補] 確認中のグループ。★不可逆な操作のため、グループ名の入力が一致するまで実行できない
let migrateDraftId = null;
// ★[EO-DEC-0258 追補4] 確認を開始したときに選ばれていた施設を控える。
//   施設管理者が複数施設を持つ場合、確認中に上のプルダウンを切り替えると
//   「画面に出ている施設名」と「実際に送る施設」がずれうるため、実行の直前に照合する。
let migrateDraftFacilityId = null;

const MIGRATE_ERROR_MESSAGES = {
  ALREADY_MIGRATED:     'このグループはすでに施設へ移されています',
  NOT_OWNER:            'このグループを作成した方だけが移せます',
  NOT_FACILITY_MANAGER: '権限がありません',
  FACILITY_GROUP_LIMIT: 'この施設のグループ数が上限（20）に達しています',
  GROUP_NOT_FOUND:      'グループが見つかりません',
  FACILITY_NOT_FOUND:   '施設が見つかりません',
  AUTH_REQUIRED:        'ログインの有効期限が切れています。画面を開き直してください',
};

function migrateErrorMessage(error) {
  if (!error) return '移せませんでした。時間をおいて再度お試しください';
  const code = (error.message || error.code || '') + '';
  for (const key of Object.keys(MIGRATE_ERROR_MESSAGES)) {
    if (code.includes(key)) return MIGRATE_ERROR_MESSAGES[key];
  }
  return '移せませんでした。時間をおいて再度お試しください';
}

// 自分が作成者で、まだどの施設にも属していないグループだけを集める。
// ★index.html の restoreSession() と同じ形のクエリにする（新しい書き方を持ち込まない）。
async function loadMigratableGroups() {
  migratableGroups = [];
  if (!currentEoUid) return;
  try {
    const { data, error } = await sb
      .from('group_members')
      .select('group_session_id, group_sessions(id, group_id, group_name, industry, region, expires_at, archived_at, facility_id, created_at)')
      .eq('eo_uid', currentEoUid)
      .eq('status', 'approved')
      .eq('is_creator', true);
    if (error) {
      console.warn('[manager.html] loadMigratableGroups failed (continue):', error);
      return;
    }
    migratableGroups = (data || [])
      .map((row) => row.group_sessions)
      .filter((g) => g && g.facility_id == null && g.archived_at == null)
      .sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
  } catch (e) {
    console.warn('[manager.html] loadMigratableGroups threw (continue):', e);
  }
}

function setMigrateMessage(text, isError) {
  const el = document.getElementById('migrate-message');
  if (!el) return;
  el.textContent = text || '';
  el.style.color = isError ? '#c0392b' : '#555';
}

async function migrateGroup(group) {
  if (migrateRunning) return;
  const facility = getSelectedFacility();
  if (!facility || !group) return;

  // ★[EO-DEC-0258 追補] グループ名の入力が一致していることを、実行の直前にもう一度確かめる。
  //   ボタンの disabled だけに頼らない（画面側の無効化はあくまで補助である）。
  const input = document.getElementById('migrate-confirm-input');
  const typed = input ? String(input.value || '').trim() : '';
  const expected = String(group.group_name || group.group_id || '').trim();
  if (typed !== expected) {
    setMigrateMessage('グループ名が一致していません。もう一度ご確認ください。', true);
    return;
  }

  // ★[EO-DEC-0258 追補4] 確認を始めたときの施設と、いま選ばれている施設が同じであることを確かめる。
  //   ずれていたら送らない。移す先を取り違えると取り消せないためである。
  if (migrateDraftFacilityId != null
      && String(migrateDraftFacilityId) !== String(facility.facility_id)) {
    migrateDraftId = null;
    migrateDraftFacilityId = null;
    renderMigrateSection();
    setMigrateMessage('移す先の施設が切り替わりました。安全のため中止しました。もう一度やり直してください。', true);
    return;
  }

  migrateRunning = true;
  setMigrateMessage('移しています。しばらくお待ちください…', false);
  try {
    const { error } = await sb.rpc('migrate_group_to_facility', {
      p_group_session_id: group.id,
      p_facility_id: facility.facility_id,
    });
    if (error) { setMigrateMessage(migrateErrorMessage(error), true); return; }
    migrateDraftId = null;
    migrateDraftFacilityId = null;
    const movedTo = String(facility.facility_name == null ? '' : facility.facility_name).trim();
    await reloadManagerDataStrict();
    renderFacilityDetails();
    // ★[EO-DEC-0258 追補4] 完了の知らせにも施設名を出す。どこへ移したかを後から見て分かるようにする。
    setMigrateMessage('「' + (group.group_name || group.group_id || '') + '」を「'
      + (movedTo || 'この施設') + '」へ移しました。', false);
  } catch (e) {
    setMigrateMessage(migrateErrorMessage(e), true);
  } finally {
    migrateRunning = false;
  }
}

// ★[EO-DEC-0258 追補4] 移行の確認文で、取り違えると困る語（グループ名・施設名）を赤の太字にする。
//   textContent では色を分けられないため、この関数で span を作って差し込む。

  span.style.fontWeight = '700';
  span.textContent = text;

}

function renderMigrateSection() {
  const container = document.getElementById('migrate-container');
  if (!container) return;
  container.replaceChildren();

  const facility = getSelectedFacility();
  if (!facility) return;
  // ★[EO-DEC-0258 追補4] 確認文に出す施設名。空のときだけ「この施設」に戻す。
  const facilityLabel = String(facility.facility_name == null ? '' : facility.facility_name).trim()
                        || 'この施設';
  // ★契約状態が許可リストに無い施設では、このカードごと出さない（判定は1箇所を使い回す）
  if (!isFacilityContractActive(facility)) return;

  const header = document.createElement('div');
  header.className = 'mg-group-card-header';
  const title = document.createElement('div');
  title.className = 'mg-group-card-title';
  title.textContent = 'ST版グループをこの施設へ移す';
  header.appendChild(title);
  container.appendChild(header);

  // ★[EO-DEC-0258 追補] is_creator は manager_change_group_owner で他人へ引き継げるため、
  //   「あなたが作成した」ではなく「あなたが管理者になっている」が実態に合う。
  const note = document.createElement('div');
  note.style.fontSize = '12px';
  note.style.color = '#666';
  note.style.margin = '4px 0 8px';
  note.textContent = 'あなたが管理者になっている、まだどの施設にも属していないST版グループを、この施設の所属にします。'
                   + 'グループを作り直すのではなく、同じグループのまま施設に付け替えます。'
                   + 'メンバー・過去の連絡・引き継ぎはそのまま残ります。';
  container.appendChild(note);

  const warn = document.createElement('div');
  warn.style.fontSize = '12px';
  warn.style.color = '#c0392b';
  warn.style.fontWeight = '700';
  warn.style.margin = '0 0 12px';
  warn.textContent = '★仕事で使用するグループだけを移してください。個人・私的なグループは移行しないでください。'
                   + 'この操作は取り消せません。';
  container.appendChild(warn);

  const msg = document.createElement('div');
  msg.id = 'migrate-message';
  msg.style.fontSize = '12px';
  msg.style.margin = '0 0 8px';
  msg.style.minHeight = '16px';
  msg.style.color = '#555';
  container.appendChild(msg);

  if (!migratableGroups.length) {
    const empty = document.createElement('div');
    empty.className = 'mg-group-empty';
    empty.textContent = '移せるグループはありません';
    container.appendChild(empty);
    return;
  }

  migratableGroups.forEach((g) => {
    const row = document.createElement('div');
    row.className = 'mg-group-row';

    const expected = String(g.group_name || g.group_id || '').trim();

    const name = document.createElement('div');
    name.className = 'mg-group-row-name';
    name.textContent = g.group_name || g.group_id || '';
    row.appendChild(name);

    const sub = document.createElement('div');
    sub.className = 'mg-group-row-sub';
    sub.textContent = (g.group_id || '')
      + (INDUSTRY_LABELS[g.industry] ? '　' + INDUSTRY_LABELS[g.industry] : '');
    row.appendChild(sub);

    const actions = document.createElement('div');
    actions.className = 'mg-group-row-actions';

    if (String(migrateDraftId) !== String(g.id)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mg-group-btn mg-group-btn-primary';
      btn.textContent = 'この施設へ移す';
      btn.addEventListener('click', () => {
        migrateDraftId = g.id;
        // ★[EO-DEC-0258 追補4] 確認を始めた時点の施設を控える
        migrateDraftFacilityId = facility.facility_id;
        setMigrateMessage('', false);
        renderMigrateSection();
      });
      actions.appendChild(btn);
      row.appendChild(actions);
      container.appendChild(row);
      return;
    }

    // ★[EO-DEC-0258 追補] 不可逆な操作のため、実行前にグループ名の入力を求める。
    //   入力が一致するまで「移行する」は押せない。
    row.appendChild(actions);
    container.appendChild(row);

    // ★[2026/8/16] ここに const box = document.createElement('div') があったが、
    //   どこにも appendChild されておらず（detail 以降はすべて container へ直接付けている）
    //   .mg-group-form のCSSが1つも効かない死んだコードだったため削除した。
    //   ★見た目は1ピクセルも変わらない（案ア）。枠で囲う案イは採らない。
    const detail = document.createElement('div');
    detail.style.fontSize = '12px';
    detail.style.color = '#333';
    detail.style.lineHeight = '1.8';
    detail.style.margin = '0 0 10px';
    // ★安全のための説明なので、1行ずつ改行して読ませる
    detail.style.whiteSpace = 'pre-line';
    // ★[EO-DEC-0258 追補4] 施設管理者が複数の施設を持つ場合、「この施設」では
    //   どこへ移すのかが分からず、移す先を取り違えうる（移行は取り消せない）。
    //   そこで施設名を出し、グループ名と施設名を赤の太字で強調する。
    //   ★施設名が空のときだけ「この施設」に戻す（原則77・既定は安全側の文言）。
    detail.appendChild(document.createTextNode('「'));
    detail.appendChild(migrateEmphasis(expected));
    detail.appendChild(document.createTextNode('」を「'));
    detail.appendChild(migrateEmphasis(facilityLabel));
    detail.appendChild(document.createTextNode(
        '」へ移します。\n'
      + '・連絡と画像の保存期間が 60日／30日 から 180日 に変わります\n'
      + '・グループの1年の有効期限が無くなります\n'
      + '・地域の表示が 「' + facilityLabel + '」の地域 に変わります（施設に地域が設定されていない場合は空欄になります）\n'
      + '・メンバー・過去の連絡・引き継ぎは そのまま残ります'));
    container.appendChild(detail);

    const caution = document.createElement('div');
    caution.style.fontSize = '12px';
    caution.style.color = '#c0392b';
    caution.style.fontWeight = '700';
    caution.style.margin = '0 0 10px';
    caution.textContent = '★この操作は取り消せません。施設から外して元に戻す機能はありません。';
    container.appendChild(caution);

    const label = document.createElement('label');
    label.className = 'mg-group-form-label';
    // ★[EO-DEC-0258 追補4] 入力を求めるグループ名も赤の太字にして、見比べやすくする
    label.appendChild(document.createTextNode('確認のため、グループ名「'));
    label.appendChild(migrateEmphasis(expected));
    label.appendChild(document.createTextNode('」を入力してください'));
    container.appendChild(label);

    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'migrate-confirm-input';
    input.className = 'mg-group-input';
    container.appendChild(input);

    const formActions = document.createElement('div');
    formActions.className = 'mg-group-form-actions';

    const runBtn = document.createElement('button');
    runBtn.type = 'button';
    runBtn.className = 'mg-group-btn mg-group-btn-primary';
    runBtn.textContent = '移行する';
    runBtn.disabled = true;
    runBtn.addEventListener('click', () => migrateGroup(g));
    formActions.appendChild(runBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'mg-group-btn';
    cancelBtn.textContent = 'やめる';
    cancelBtn.addEventListener('click', () => {
      migrateDraftId = null;
      migrateDraftFacilityId = null;
      setMigrateMessage('', false);
      renderMigrateSection();
    });
    formActions.appendChild(cancelBtn);
    container.appendChild(formActions);

    // ★前後の空白だけ trim し、それ以外は完全一致とする
    input.addEventListener('input', () => {
      runBtn.disabled = (String(input.value || '').trim() !== expected);
    });
  });
}

async function createGroup() {
  if (!groupCreateDraft) return;
  const facility = getSelectedFacility();
  if (!facility) return;
  const groupName = (groupCreateDraft.groupName || '').trim();
  const industry = (groupCreateDraft.industry || '').trim();
  const displayName = (groupCreateDraft.displayName || '').trim();
  if (!groupName || !industry || !displayName) {
    groupSectionErrorMessage = '必須項目を入力してください';
    groupSectionInfoMessage = '';
    renderGroupList();
    return;
  }
  const confirmed = window.confirm(
    '「' + groupName + '」を作成します。\n作成すると、あなたがこのグループの管理者として参加します。'
  );
  if (!confirmed) return;

  setGroupSectionButtonsDisabled(true);
  groupSectionErrorMessage = '';
  groupSectionInfoMessage = '';
  try {
    const { error } = await sb.rpc('manager_create_group', {
      p_facility_id: facility.facility_id,
      p_group_id: generateGroupId(),
      p_group_name: groupName,
      p_industry: industry,
      p_display_name: displayName,
    });
    if (error) {
      groupSectionErrorMessage = managerErrorMessage(error);
      renderGroupList();
      return;
    }
    groupCreateDraft = null;
    await reloadManagerDataStrict();
    renderFacilityDetails();
  } catch (e) {
    groupSectionErrorMessage = managerErrorMessage(e);
    renderGroupList();
  } finally {
    setGroupSectionButtonsDisabled(false);
  }
}

async function setGidMask(group) {
  const willMask = !group.gid_masked;
  let confirmMsg;
  if (willMask) {
    confirmMsg =
      '「' + (group.group_name || '') + '」のグループIDを伏字にします。\n' +
      '一般の利用者には SL-●●●●●-●●●● と表示されます。\n\n' +
      '★これは表示を隠すだけで、グループIDそのものは変わりません。\n' +
      '利用者の画面には次回起動時に反映されます。';
  } else {
    confirmMsg =
      '「' + (group.group_name || '') + '」のグループIDの伏字を解除します。\n' +
      '一般の利用者に実際のグループIDが表示されます。\n\n' +
      '★一度表示されたグループIDは、再び伏字にしても、すでに確認した利用者には\n' +
      '　無効になりません。締め直す場合はグループIDを再発行してください。\n\n' +
      '利用者の画面には次回起動時に反映されます。';
  }
  const confirmed = window.confirm(confirmMsg);
  if (!confirmed) return;

  setGroupSectionButtonsDisabled(true);
  groupSectionErrorMessage = '';
  groupSectionInfoMessage = '';
  try {
    const { data, error } = await sb.rpc('manager_set_gid_mask', {
      p_group_session_id: group.group_session_id,
      p_gid_masked: willMask,
    });
    if (error) {
      groupSectionErrorMessage = managerErrorMessage(error);
      renderGroupList();
      return;
    }
    if (data && data.changed === false) {
      groupSectionInfoMessage = 'すでにその状態です';
      renderGroupList();
      return;
    }
    groupSectionInfoMessage = willMask ? '伏字にしました' : '伏字を解除しました';
    await reloadManagerDataStrict();
    renderFacilityDetails();
  } catch (e) {
    groupSectionErrorMessage = managerErrorMessage(e);
    renderGroupList();
  } finally {
    setGroupSectionButtonsDisabled(false);
  }
}

async function addGroupManager(group) {
  const candidates = getGroupOwnerCandidates(group);
  const eoUid = groupOwnerPickerEoUid;
  if (!eoUid) {
    groupSectionErrorMessage = '追加する管理者を選択してください';
    groupSectionInfoMessage = '';
    renderGroupList();
    return;
  }
  const target = candidates.find((candidate) => String(candidate.out_eo_uid) === String(eoUid));
  if (!target) {
    groupSectionErrorMessage = '候補者の情報を再読み込みしてください';
    groupSectionInfoMessage = '';
    renderGroupList();
    return;
  }
  const displayNames = Array.isArray(target.out_display_names) ? target.out_display_names : [];
  const targetName = displayNames.join(' / ') || '（名前なし）';
  const confirmed = window.confirm(
    '「' + targetName + '」をグループ管理者に追加します。\n追加後もあなたは引き続きこのグループの管理者です。'
  );
  if (!confirmed) return;

  setGroupSectionButtonsDisabled(true);
  groupSectionErrorMessage = '';
  groupSectionInfoMessage = '';
  try {
    const { error } = await sb.rpc('manager_change_group_owner', {
      p_group_session_id: group.group_session_id,
      p_new_owner_eo_uid: eoUid,
    });
    if (error) {
      groupSectionErrorMessage = managerErrorMessage(error);
      renderGroupList();
      return;
    }
    groupOwnerPickerTargetId = null;
    groupOwnerPickerEoUid = '';
    await reloadManagerDataStrict();
    renderFacilityDetails();
  } catch (e) {
    groupSectionErrorMessage = managerErrorMessage(e);
    renderGroupList();
  } finally {
    setGroupSectionButtonsDisabled(false);
  }
}

function buildGroupRow(group, options = {}) {
  const row = document.createElement('div');
  row.className = 'mg-group-row';

  const header = document.createElement('div');
  header.className = 'mg-group-header';

  const name = document.createElement('span');
  name.className = 'mg-group-name';
  name.textContent = group.group_name || '';
  header.appendChild(name);

  const industry = document.createElement('span');
  industry.className = 'mg-group-industry';
  industry.textContent = INDUSTRY_LABELS[group.industry] || group.industry || '';
  header.appendChild(industry);

  row.appendChild(header);

  const gid = document.createElement('div');
  gid.className = 'mg-group-gid';
  gid.textContent = group.group_id || '';
  row.appendChild(gid);

  const meta = document.createElement('div');
  meta.className = 'mg-group-meta';
  let metaText = '👥 ' + (group.member_count != null ? group.member_count : 0) + '人';
  if (group.signage_count) {
    metaText += '  📺 ' + group.signage_count + '台';
  }
  const hasCreators = Array.isArray(group.creator_names) && group.creator_names.length > 0;
  if (hasCreators) {
    metaText += '   管理者: ' + group.creator_names.join('、');
  }
  meta.textContent = metaText;
  row.appendChild(meta);

  if (!options.archived && Array.isArray(group.creator_names) && group.creator_names.length === 0) {
    const noOwnerBadge = document.createElement('span');
    noOwnerBadge.className = 'mg-group-noowner';
    noOwnerBadge.textContent = '管理者なし';
    noOwnerBadge.setAttribute('role', 'status');
    row.appendChild(noOwnerBadge);
  }

  if (group.gid_masked === true) {
    const maskedBadge = document.createElement('span');
    maskedBadge.className = 'mg-group-masked-badge';
    maskedBadge.textContent = '伏字中';
    maskedBadge.setAttribute('role', 'status');
    row.appendChild(maskedBadge);
  }

  const groupId = String(group.group_session_id || '');
  const isArchived = !!options.archived;
  if (!isArchived) {
    const actions = document.createElement('div');
    actions.className = 'mg-group-actions';

    const renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'mg-group-btn';
    renameBtn.textContent = '名前を変更';
    renameBtn.addEventListener('click', () => {
      groupRenameTargetId = groupId;
      groupRenameDraftName = group.group_name || '';
      groupOwnerPickerTargetId = null;
      groupOwnerPickerEoUid = '';
      groupSectionErrorMessage = '';
      groupSectionInfoMessage = '';
      renderGroupList();
    });
    actions.appendChild(renameBtn);

    const archiveBtn = document.createElement('button');
    archiveBtn.type = 'button';
    archiveBtn.className = 'mg-group-btn mg-group-btn-danger';
    archiveBtn.textContent = 'アーカイブ';
    archiveBtn.addEventListener('click', () => archiveGroup(group));
    actions.appendChild(archiveBtn);

    const reissueBtn = document.createElement('button');
    reissueBtn.type = 'button';
    reissueBtn.className = 'mg-group-btn';
    reissueBtn.textContent = 'グループID再発行';
    reissueBtn.addEventListener('click', () => reissueGroupGid(group));
    actions.appendChild(reissueBtn);

    const maskBtn = document.createElement('button');
    maskBtn.type = 'button';
    maskBtn.className = 'mg-group-btn';
    maskBtn.textContent = group.gid_masked ? '伏字を解除' : '伏字にする';
    maskBtn.addEventListener('click', () => setGidMask(group));
    actions.appendChild(maskBtn);

    const ownerBtn = document.createElement('button');
    ownerBtn.type = 'button';
    ownerBtn.className = 'mg-group-btn mg-group-btn-primary';
    ownerBtn.textContent = 'グループ管理者を追加';
    ownerBtn.addEventListener('click', () => {
      if (groupOwnerPickerTargetId === groupId) {
        groupOwnerPickerTargetId = null;
        groupOwnerPickerEoUid = '';
      } else {
        groupOwnerPickerTargetId = groupId;
        const candidates = getGroupOwnerCandidates(group);
        groupOwnerPickerEoUid = candidates.length > 0 ? String(candidates[0].out_eo_uid || '') : '';
      }
      groupRenameTargetId = null;
      groupRenameDraftName = '';
      groupSectionErrorMessage = '';
      groupSectionInfoMessage = '';
      renderGroupList();
    });
    actions.appendChild(ownerBtn);

    row.appendChild(actions);

    if (groupRenameTargetId === groupId) {
      const form = document.createElement('div');
      form.className = 'mg-group-form';

      const label = document.createElement('label');
      label.className = 'mg-group-form-label';
      label.textContent = '新しいグループ名';
      form.appendChild(label);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'mg-group-input';
      input.value = groupRenameDraftName;
      input.addEventListener('input', (event) => {
        groupRenameDraftName = event.target.value;
      });
      form.appendChild(input);

      const formActions = document.createElement('div');
      formActions.className = 'mg-group-form-actions';

      const submitBtn = document.createElement('button');
      submitBtn.type = 'button';
      submitBtn.className = 'mg-group-btn mg-group-btn-primary';
      submitBtn.textContent = '変更を保存';
      submitBtn.addEventListener('click', () => renameGroup(group));
      formActions.appendChild(submitBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'mg-group-btn';
      cancelBtn.textContent = 'キャンセル';
      cancelBtn.addEventListener('click', () => {
        groupRenameTargetId = null;
        groupRenameDraftName = '';
        groupSectionErrorMessage = '';
        groupSectionInfoMessage = '';
        renderGroupList();
      });
      formActions.appendChild(cancelBtn);

      form.appendChild(formActions);
      row.appendChild(form);
    }

    if (groupOwnerPickerTargetId === groupId) {
      const picker = document.createElement('div');
      picker.className = 'mg-group-form';

      const pickerLabel = document.createElement('label');
      pickerLabel.className = 'mg-group-form-label';
      pickerLabel.textContent = 'グループ管理者に追加する方';
      picker.appendChild(pickerLabel);

      const select = document.createElement('select');
      select.className = 'mg-group-select';
      const candidates = getGroupOwnerCandidates(group);
      candidates.forEach((candidate) => {
        const option = document.createElement('option');
        option.value = candidate.out_eo_uid;
        const displayNames = Array.isArray(candidate.out_display_names) ? candidate.out_display_names : [];
        option.textContent = displayNames.join(' / ') || '（名前なし）';
        select.appendChild(option);
      });
      if (candidates.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = '追加できる候補者はいません';
        select.appendChild(option);
      }
      select.value = groupOwnerPickerEoUid || (candidates[0] ? String(candidates[0].out_eo_uid || '') : '');
      select.addEventListener('change', (event) => {
        groupOwnerPickerEoUid = event.target.value;
      });
      picker.appendChild(select);

      const pickerActions = document.createElement('div');
      pickerActions.className = 'mg-group-form-actions';

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'mg-group-btn mg-group-btn-primary';
      addBtn.textContent = 'グループ管理者を追加';
      addBtn.disabled = candidates.length === 0;
      addBtn.addEventListener('click', () => addGroupManager(group));
      pickerActions.appendChild(addBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'mg-group-btn';
      cancelBtn.textContent = 'キャンセル';
      cancelBtn.addEventListener('click', () => {
        groupOwnerPickerTargetId = null;
        groupOwnerPickerEoUid = '';
        groupSectionErrorMessage = '';
        groupSectionInfoMessage = '';
        renderGroupList();
      });
      pickerActions.appendChild(cancelBtn);

      picker.appendChild(pickerActions);
      row.appendChild(picker);
    }
  } else {
    const actions = document.createElement('div');
    actions.className = 'mg-group-actions';
    const restoreBtn = document.createElement('button');
    restoreBtn.type = 'button';
    restoreBtn.className = 'mg-group-btn mg-group-btn-primary';
    restoreBtn.textContent = '復帰';
    restoreBtn.addEventListener('click', () => unarchiveGroup(group));
    actions.appendChild(restoreBtn);
    row.appendChild(actions);
  }

  return row;
}

function renderGroupList() {
  const container = document.getElementById('group-list-container');
  if (!container) return;
  container.replaceChildren();

  const facilityGroups = managerGroups.filter((g) => String(g.facility_id) === String(selectedFacilityId));
  const active = facilityGroups.filter((g) => g.archived_at == null);
  const archived = facilityGroups.filter((g) => g.archived_at != null);

  const header = document.createElement('div');
  header.className = 'mg-group-card-header';

  const title = document.createElement('div');
  title.className = 'mg-group-card-title';
  title.textContent = 'グループ一覧';
  header.appendChild(title);

  const createBtn = document.createElement('button');
  createBtn.type = 'button';
  // [EO-DEC-0256] 無効化の対象を確実に指定するため専用のIDを持たせる（クラスは見た目・共通用途のもの）
  createBtn.id = 'group-create-entry-btn';
  createBtn.className = 'mg-group-btn mg-group-btn-primary';
  createBtn.textContent = groupCreateDraft ? '入力を閉じる' : 'グループを作成';
  createBtn.addEventListener('click', () => {
    if (groupCreateDraft) {
      groupCreateDraft = null;
    } else {
      groupCreateDraft = { groupName: '', industry: '', displayName: '' };
    }
    groupRenameTargetId = null;
    groupRenameDraftName = '';
    groupOwnerPickerTargetId = null;
    groupOwnerPickerEoUid = '';
    groupSectionErrorMessage = '';
    groupSectionInfoMessage = '';
    renderGroupList();
  });
  header.appendChild(createBtn);

  container.appendChild(header);

  // [EO-DEC-0256] 契約状態が許可リストに無いときは、グループ作成の導線だけを無効化する
  applyGroupCreateGuard();

  if (groupSectionErrorMessage) {
    const errorEl = document.createElement('div');
    errorEl.className = 'mg-group-error';
    errorEl.textContent = groupSectionErrorMessage;
    container.appendChild(errorEl);
  }
  if (groupSectionInfoMessage) {
    const infoEl = document.createElement('div');
    infoEl.className = 'mg-group-info';
    infoEl.textContent = groupSectionInfoMessage;
    container.appendChild(infoEl);
  }

  if (groupCreateDraft) {
    const form = document.createElement('div');
    form.className = 'mg-group-form';

    const nameLabel = document.createElement('label');
    nameLabel.className = 'mg-group-form-label';
    nameLabel.textContent = 'グループ名（必須）';
    form.appendChild(nameLabel);

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'mg-group-input';
    nameInput.value = groupCreateDraft.groupName || '';
    nameInput.addEventListener('input', (event) => {
      groupCreateDraft.groupName = event.target.value;
    });
    form.appendChild(nameInput);

    const industryLabel = document.createElement('label');
    industryLabel.className = 'mg-group-form-label';
    industryLabel.textContent = '業種（必須）';
    form.appendChild(industryLabel);

    const industrySelect = document.createElement('select');
    industrySelect.className = 'mg-group-select';
    const emptyOption = document.createElement('option');
    emptyOption.value = '';
    emptyOption.textContent = '選択してください';
    industrySelect.appendChild(emptyOption);
    Object.entries(INDUSTRY_LABELS).forEach(([industryKey, industryLabelText]) => {
      if (industryKey === 'event') return;
      const option = document.createElement('option');
      option.value = industryKey;
      option.textContent = industryLabelText;
      industrySelect.appendChild(option);
    });
    industrySelect.value = groupCreateDraft.industry || '';
    industrySelect.addEventListener('change', (event) => {
      groupCreateDraft.industry = event.target.value;
    });
    form.appendChild(industrySelect);

    const displayLabel = document.createElement('label');
    displayLabel.className = 'mg-group-form-label';
    displayLabel.textContent = '作成者としての表示名（必須）';
    form.appendChild(displayLabel);

    const displayInput = document.createElement('input');
    displayInput.type = 'text';
    displayInput.className = 'mg-group-input';
    displayInput.value = groupCreateDraft.displayName || '';
    displayInput.addEventListener('input', (event) => {
      groupCreateDraft.displayName = event.target.value;
    });
    form.appendChild(displayInput);

    const formActions = document.createElement('div');
    formActions.className = 'mg-group-form-actions';

    const submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'mg-group-btn mg-group-btn-primary';
    submitBtn.textContent = '作成する';
    submitBtn.addEventListener('click', () => createGroup());
    formActions.appendChild(submitBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'mg-group-btn';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.addEventListener('click', () => {
      groupCreateDraft = null;
      groupSectionErrorMessage = '';
      groupSectionInfoMessage = '';
      renderGroupList();
    });
    formActions.appendChild(cancelBtn);
    form.appendChild(formActions);

    container.appendChild(form);
  }

  if (facilityGroups.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'mg-group-empty';
    empty.textContent = 'この施設にはまだグループがありません';
    container.appendChild(empty);
    return;
  }

  const list = document.createElement('div');
  list.className = 'mg-group-list';
  active.forEach((group) => list.appendChild(buildGroupRow(group, { archived: false })));
  if (active.length > 0) {
    container.appendChild(list);
  }

  if (archived.length > 0) {
    const details = document.createElement('details');
    details.className = 'mg-archived';

    const summary = document.createElement('summary');
    summary.className = 'mg-archived-summary';
    summary.textContent = 'アーカイブ済み（' + archived.length + '）';
    details.appendChild(summary);

    const archivedList = document.createElement('div');
    archivedList.className = 'mg-archived-list';
    archived.forEach((group) => {
      const row = buildGroupRow(group, { archived: true });
      const archivedAt = document.createElement('div');
      archivedAt.className = 'mg-group-archived-at';
      archivedAt.textContent = 'アーカイブ日時: ' + new Date(group.archived_at).toLocaleString('ja-JP');
      row.appendChild(archivedAt);
      archivedList.appendChild(row);
    });
    details.appendChild(archivedList);
    container.appendChild(details);
  }

}

function managerErrorMessage(error) {
  if (!error) return '処理できませんでした。時間をおいて再度お試しください';
  const code = (error.code || error.message || '');
  for (const key of Object.keys(MANAGER_ERROR_MESSAGES)) {
    if (code.includes(key)) return MANAGER_ERROR_MESSAGES[key];
  }
  return '処理できませんでした。時間をおいて再度お試しください';
}

function renderManagerSection() {
  const container = document.getElementById('manager-section-container');
  if (!container) return;
  container.replaceChildren();

  const facility = getSelectedFacility();
  if (!facility) return;

  const section = document.createElement('div');
  section.className = 'mg-manager-section';

  // ── 現在の管理者一覧 ──
  const currentCard = document.createElement('div');
  currentCard.className = 'mg-manager-card';

  const currentTitle = document.createElement('div');
  currentTitle.className = 'mg-manager-card-title';
  currentTitle.textContent = '施設管理者';
  currentCard.appendChild(currentTitle);

  const currentErrorEl = document.createElement('div');
  currentErrorEl.className = 'mg-manager-error';
  currentErrorEl.hidden = true;
  currentCard.appendChild(currentErrorEl);

  // ★[EO-DEC-0259] 施設管理者の一覧は facility_managers を正とする。

  //   施設にグループが0件だと1行も返らず「管理者情報がありません」と出ていた。
  const managers = facilityManagers.filter(
    (m) => String(m.out_facility_id) === String(selectedFacilityId)
  );

    const empty = document.createElement('div');
    empty.className = 'mg-manager-empty';
    empty.textContent = '管理者情報がありません';
    currentCard.appendChild(empty);
  } else {
    const list = document.createElement('div');
    list.className = 'mg-manager-list';
    managers.forEach((mgr) => {
      const row = document.createElement('div');
      row.className = 'mg-manager-row';

      const info = document.createElement('div');
      info.className = 'mg-manager-info';

      const nameEl = document.createElement('span');
      nameEl.className = 'mg-manager-name';
      // ★[EO-DEC-0259] facility_managers.display_name は経路によって空のことがある
      //   （セルフ契約で自動的に施設管理者になる経路は設定していない）。
      //   その場合は、この施設のグループでの表示名をフォールバックに使う。
      const managerName = managerDisplayName(mgr);
      nameEl.textContent = managerName;
      info.appendChild(nameEl);

      if (mgr.out_is_main) {
        const mainBadge = document.createElement('span');
        mainBadge.className = 'mg-manager-self-badge';
        mainBadge.textContent = '（主）';
        nameEl.appendChild(mainBadge);
      }

      if (currentEoUid && mgr.out_eo_uid === currentEoUid) {
        const selfBadge = document.createElement('span');
        selfBadge.className = 'mg-manager-self-badge';
        selfBadge.textContent = '（あなた）';
        nameEl.appendChild(selfBadge);
      }

      row.appendChild(info);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'mg-manager-btn';
      removeBtn.textContent = '削除';
      removeBtn.dataset.eoUid = mgr.out_eo_uid;
      removeBtn.dataset.displayName = managerName;
      removeBtn.addEventListener('click', () => {
        removeFacilityManager(
          removeBtn,
          currentErrorEl,
          String(facility.facility_id),
          mgr.out_eo_uid,
          managerName
        );
      });
      row.appendChild(removeBtn);

      list.appendChild(row);
    });
    currentCard.appendChild(list);
  }

  section.appendChild(currentCard);

  // ── 管理者候補リスト ──
  const candidateCard = document.createElement('div');
  candidateCard.className = 'mg-manager-card';

  const candidateTitle = document.createElement('div');
  candidateTitle.className = 'mg-manager-card-title';
  candidateTitle.textContent = '管理者候補';

  const candidateErrorEl = document.createElement('div');
  candidateErrorEl.className = 'mg-manager-error';
  candidateErrorEl.hidden = true;
  candidateCard.appendChild(candidateErrorEl);

  const candidates = memberCandidates.filter(
    (c) => String(c.out_facility_id) === String(selectedFacilityId) && !c.out_is_manager
  );

  if (candidates.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'mg-manager-empty';
    empty.textContent = '追加できる候補者はいません';
    candidateCard.appendChild(empty);
  } else {
    const list = document.createElement('div');
    list.className = 'mg-manager-list';
    candidates.forEach((c) => {
      const row = document.createElement('div');
      row.className = 'mg-manager-row';

      const info = document.createElement('div');
      info.className = 'mg-manager-info';

      const nameEl = document.createElement('div');
      nameEl.className = 'mg-manager-name';
      const displayNames = Array.isArray(c.out_display_names) ? c.out_display_names : [];
      nameEl.textContent = displayNames.join(' / ') || '（名前なし）';
      info.appendChild(nameEl);

      const groupsEl = document.createElement('div');
      groupsEl.className = 'mg-manager-groups';
      const groupNames = Array.isArray(c.out_group_names) ? c.out_group_names : [];
      groupsEl.textContent = groupNames.join('、') || '';
      info.appendChild(groupsEl);

      row.appendChild(info);

      if (c.out_is_manager) {
        const addedLabel = document.createElement('span');
        addedLabel.className = 'mg-manager-added-label';
        addedLabel.textContent = '追加済み';
        row.appendChild(addedLabel);
      } else {
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'mg-manager-btn mg-manager-btn-add';
        addBtn.textContent = '追加';
        addBtn.dataset.eoUid = c.out_eo_uid;
        addBtn.addEventListener('click', () => {
          addFacilityManager(
            addBtn,
            candidateErrorEl,
            String(facility.facility_id),
            c.out_eo_uid,
            displayNames.join(' / ') || ''
          );
        });
        row.appendChild(addBtn);
      }

      list.appendChild(row);
    });
    candidateCard.appendChild(list);
  }

  section.appendChild(candidateCard);
  container.appendChild(section);
}

async function reloadManagerData() {
  const { data: facilityData, error: facilityError } = await sb.rpc('manager_get_my_facilities');
  if (!facilityError && Array.isArray(facilityData)) {
    managerFacilities = facilityData;
  }
  const { data: groupData, error: groupError } = await sb.rpc('manager_list_groups');
  if (!groupError && Array.isArray(groupData)) {
    managerGroups = groupData;
  }
  const { data: candidateData, error: candidateError } = await sb.rpc('manager_list_member_candidates');
  if (!candidateError && Array.isArray(candidateData)) {
    memberCandidates = candidateData;
  }
  // [EO-DEC-0258] 施設写真などの更新後にも移行候補を読み直す
  await loadMigratableGroups();
  // [EO-DEC-0259] 施設管理者の一覧
  await loadFacilityManagers();
}

function setManagerSectionButtonsDisabled(disabled) {
  const section = document.querySelector('.mg-manager-section');
  if (!section) return;
  section.querySelectorAll('button').forEach((button) => {
    button.disabled = disabled;
  });
}

async function addFacilityManager(btn, errorEl, facilityId, eoUid, displayName) {
  const confirmed = window.confirm((displayName || '（名前なし）') + ' を施設管理者に追加しますか？');
  if (!confirmed) return;

  setManagerSectionButtonsDisabled(true);
  errorEl.hidden = true;
  try {
    const { error } = await sb.rpc('manager_add_facility_manager', {
      p_facility_id: facilityId,
      p_new_eo_uid: eoUid,
    });
    if (error) {
      errorEl.textContent = managerErrorMessage(error);
      errorEl.hidden = false;
      return;
    }
    await reloadManagerData();
    renderManagerSection();
  } catch (e) {
    errorEl.textContent = managerErrorMessage(e);
    errorEl.hidden = false;
  } finally {
    setManagerSectionButtonsDisabled(false);
  }
}

async function removeFacilityManager(btn, errorEl, facilityId, eoUid, displayName) {
  const isSelf = currentEoUid && eoUid === currentEoUid;
  if (isSelf) {
    const confirmed = window.confirm(
      '自分を施設管理者から外すと、この施設の管理画面を利用できなくなります。よろしいですか？'
    );
    if (!confirmed) return;
  } else {
    const confirmed = window.confirm(displayName + ' を施設管理者から削除しますか？');
    if (!confirmed) return;
  }

  setManagerSectionButtonsDisabled(true);
  errorEl.hidden = true;
  try {
    const { error } = await sb.rpc('manager_remove_facility_manager', {
      p_facility_id: facilityId,
      p_target_eo_uid: eoUid,
    });
    if (error) {
      errorEl.textContent = managerErrorMessage(error);
      errorEl.hidden = false;
      return;
    }
    if (isSelf) {
      // 自分を外した場合は権限がなくなるため denied 画面へ
      await reloadManagerData();
      showScreen('screen-denied');
      return;
    }
    await reloadManagerData();
    renderManagerSection();
  } catch (e) {
    errorEl.textContent = managerErrorMessage(e);
    errorEl.hidden = false;
  } finally {
    setManagerSectionButtonsDisabled(false);
  }
}

function renderFacilitySelect() {
  const select = document.getElementById('facility-select');
  if (!select) return;
  select.replaceChildren();
  managerFacilities.forEach((facility) => {
    const option = document.createElement('option');
    option.value = String(facility.facility_id);
    option.textContent = facility.facility_name == null ? '' : String(facility.facility_name);
    select.appendChild(option);
  });
  select.value = String(selectedFacilityId);
  renderFacilityDetails();
}

async function init() {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (error) {
    console.error('[manager.html] liff.init failed:', error);
    showScreen('screen-denied');
    return;
  }

  // [EO-DEC-0208] liff.init 成功直後に1回だけ判定する。
  //   これ以降のすべての screen-denied 経路より前に置くこと。
  applyBackToEdgeOpsVisibility();

  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: window.location.href });
    return;
  }

  // ★auth.js の getCurrentFacility() / getCurrentRole() は使わない。
  //   facility_managers を直接SELECTしており、第189回（EO-DEC-0189）の
  //   GRANT剥奪後は成立しない。施設判定は manager_get_my_facilities() RPC を使う。
  try {
    const authResult = await resolveEoUid(sb);
    if (!authResult || !authResult.eoUid) {
      throw new Error('resolveEoUid returned no eoUid');
    }
    currentEoUid = authResult.eoUid;
  } catch (error) {
    console.error('[manager.html] resolveEoUid failed:', error);
    try {
      liff.logout();
    } catch (_) {}
    liff.login({ redirectUri: window.location.href });
    return;
  }

  const { data, error } = await sb.rpc('manager_get_my_facilities');
  if (error) {
    console.error('[manager.html] manager_get_my_facilities error:', error);
    showScreen('screen-denied');
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    console.warn('[manager.html] manager_get_my_facilities returned 0 rows.');
    showScreen('screen-denied');
    return;
  }

  managerFacilities = data;
  selectedFacilityId = String((managerFacilities.find((facility) => facility && facility.is_main) || managerFacilities[0]).facility_id);

  const { data: groupData, error: groupError } = await sb.rpc('manager_list_groups');
  if (groupError) {
    console.error('[manager.html] manager_list_groups error:', groupError);
  } else if (Array.isArray(groupData)) {
    managerGroups = groupData;
  }

  const { data: candidateData, error: candidateError } = await sb.rpc('manager_list_member_candidates');
  if (candidateError) {
    console.warn('[manager.html] manager_list_member_candidates error:', candidateError);
  } else if (Array.isArray(candidateData)) {
    memberCandidates = candidateData;
  }

  // [EO-DEC-0258] 初回表示のときも移行候補を読む（失敗しても画面は止めない）
  await loadMigratableGroups();
  // [EO-DEC-0259] 初回表示のときも施設管理者の一覧を読む
  await loadFacilityManagers();

  renderFacilitySelect();
  showScreen('screen-main');
}

// [2026/8/11 EO-DEC-0208 論点3＝案ア] EdgeOps 本体へ戻る導線
// index.html は liff.isInClient() が false だと全画面の遮断画面を出して操作を止める（第64回判定）。
// manager.html は PC ブラウザでも動作するため、LINEアプリ内で開かれているときだけ表示する。
// PC では従来どおりログアウトのみを出口とする。
function backToEdgeOps() {
  window.location.href = 'https://app.edgeops.jp/index.html';
}

function applyBackToEdgeOpsVisibility() {
  let inClient = false;
  try {
    inClient = (typeof liff !== 'undefined' && typeof liff.isInClient === 'function' && liff.isInClient());
  } catch (e) {
    console.warn('[EO-DEC-0208] isInClient check failed:', e);
    inClient = false;
  }
  ['back-to-edgeops', 'back-to-edgeops-denied'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.hidden = !inClient;
  });

  // [EO-DEC-0255] EdgeOpsへ戻る／ログアウトの排他表示も、ここで制御する。
  //   LINEアプリ内では「ログアウト」が成立しない（同じLINEアカウントで入り直すため）。
  //   ★isInClient() の判定を2か所に増やさない。判定は1回、表示対象だけ複数にする。
  ['manager-logout-btn', 'manager-logout-denied-btn'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.hidden = inClient;
  });
}

async function managerLogout() {
  // ① 画面上のデータを先に消す（一瞬でも他人に見せない）
  managerFacilities = [];
  managerGroups = [];
  memberCandidates = [];
  selectedFacilityId = null;
  currentEoUid = null;
  setFacilityValue('facility-name', '');
  setFacilityValue('facility-code', '');
  setFacilityValue('facility-plan', '');
  setFacilityValue('facility-contract-status', '');
  setFacilityValue('facility-sub-status', '');
  setFacilityValue('facility-group-count', '');
  setFacilityValue('facility-archived-count', '');
  setFacilityValue('facility-noowner-count', '');
  setFacilityValue('facility-member-count', '');
  setFacilityValue('facility-manager-count', '');
  const bannerEl = document.getElementById('facility-banner');
  if (bannerEl) { bannerEl.textContent = ''; bannerEl.hidden = true; }
  const select = document.getElementById('facility-select');
  if (select) select.replaceChildren();
  showScreen('screen-loading');

  // ② Supabase セッション終了 ＋ EdgeOps 認証キャッシュ消去
  try {
    await clearAuthCache(sb);
  } catch (e) {
    console.warn('[manager.html] clearAuthCache failed (continue):', e);
  }

  // ③ sessionStorage のトークンを明示的に消す
  try {
    sessionStorage.removeItem('edgeops_access_token');
    sessionStorage.removeItem('edgeops_refresh_token');
  } catch (e) {
    console.warn('[manager.html] sessionStorage clear failed (continue):', e);
  }

  // ④ LINE のログアウト（最後）
  try {
    liff.logout();
  } catch (e) {
    console.warn('[manager.html] liff.logout failed (continue):', e);
  }

  // ⑤ 認証前の状態へ戻す（再読み込み）
  window.location.replace(window.location.pathname);
}

(function () {
  const MAX_BYTES = 5 * 1024 * 1024;
  let _pendingFile = null;

  const _msgEl = () => document.getElementById('facility-photo-msg');
  const _uploadBtn = () => document.getElementById('facility-photo-upload-btn');
  const _deleteBtn = () => document.getElementById('facility-photo-delete-btn');
  const _previewWrap = () => document.getElementById('facility-photo-preview-wrap');
  const _previewBg = () => document.getElementById('facility-photo-preview-bg');
  const _input = () => document.getElementById('facility-photo-input');

  function _setMsg(msg, color) {
    const el = _msgEl();
    if (!el) return;
    el.textContent = msg;
    el.style.color = color || '#333';
  }
  function _setBusy(busy) {
    const ub = _uploadBtn();
    const db = _deleteBtn();
    if (ub) ub.disabled = busy;
    if (db) db.disabled = busy;
  }
  function _errorCode(code) {
    const map = {
      AUTH_REQUIRED: 'ログインし直しが必要です',
      NOT_FACILITY_MANAGER: 'この施設の管理者ではありません',
      FORBIDDEN: '権限がありません',
      INVALID_MIME: 'JPEG以外は登録できません',
      FILE_TOO_LARGE: '5MBを超えています',
      VALIDATION_ERROR: '入力が不正です',
      STORAGE_FAILED: '時間をおいて再度お試しください',
      DB_FAILED: '時間をおいて再度お試しください',
      INTERNAL_ERROR: '時間をおいて再度お試しください',
      HEIC_UNSUPPORTED: 'HEIC形式の写真は登録できません。JPEG形式の写真を選ぶか、スクリーンショットを撮って登録してください。',
      CLIENT_INVALID_MIME: '対応していない形式です',
      CLIENT_SIZE_OVER_5MB: '圧縮しても5MBを超えています'
    };
    return map[code] || '時間をおいて再度お試しください';
  }

  const inputEl = document.getElementById('facility-photo-input');
  if (inputEl) {
    inputEl.addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;
      if (file.type !== 'image/jpeg') {
        _setMsg('JPEG形式のファイルを選択してください', '#c0392b');
        this.value = '';
        _pendingFile = null;
        const _ub = _uploadBtn();
        if (_ub) _ub.style.display = 'none';
        const _pw = _previewWrap();
        if (_pw) _pw.style.display = 'none';
        return;
      }
      if (file.size > MAX_BYTES) {
        _setMsg('5MBを超えています。より小さいファイルを選択してください', '#c0392b');
        this.value = '';
        _pendingFile = null;
        const _ub = _uploadBtn();
        if (_ub) _ub.style.display = 'none';
        const _pw = _previewWrap();
        if (_pw) _pw.style.display = 'none';
        return;
      }
      _pendingFile = file;
      _setMsg('');
      // プレビュー表示
      const reader = new FileReader();
      reader.onload = function (e) {
        const bg = _previewBg();
        if (bg) bg.style.backgroundImage = `url(${JSON.stringify(e.target.result)})`;
        const pw = _previewWrap();
        if (pw) pw.style.display = '';
        const ub = _uploadBtn();
        if (ub) ub.style.display = '';
      };
      reader.readAsDataURL(file);
    });
  }

  window.facilityPhotoUpload = async function () {
    if (!_pendingFile) return;
    if (!selectedFacilityId) { _setMsg('施設が選択されていません', '#c0392b'); return; }
    if (typeof window.callImageFunction !== 'function') { _setMsg('認証ヘルパーが読み込まれていません', '#c0392b'); return; }
    if (typeof window.compressImageForUpload !== 'function') { _setMsg('画像処理を準備できませんでした', '#c0392b'); return; }
    _setBusy(true);
    _setMsg('画像を準備中...');
    let compressed;
    try {
      // [EO-DEC-0235 論点I] 既存のクライアント圧縮方式を流用する。
      //   ★2240px以下へ縮小し品質0.88のJPEGにする。5MBの写真が1MB前後になる。
      //   ★compressImageForUpload は fullBlob と thumbBlob を返すが、施設写真に
      //     サムネは要らないので fullBlob だけ使う。
      compressed = await window.compressImageForUpload(_pendingFile);
    } catch (ce) {
      const code = ce && ce.message;
      if (code === 'HEIC_UNSUPPORTED') {
        _setMsg(_errorCode('HEIC_UNSUPPORTED'), '#c0392b');
      } else if (code === 'INVALID_MIME') {
        _setMsg(_errorCode('CLIENT_INVALID_MIME'), '#c0392b');
      } else if (code === 'SIZE_OVER_5MB') {
        _setMsg(_errorCode('CLIENT_SIZE_OVER_5MB'), '#c0392b');
      } else {
        _setMsg('画像の処理に失敗しました', '#c0392b');
      }
      _setBusy(false);
      return;
    }
    _setMsg('登録中...');
    let _gotResponse = false;
    try {
      const fd = new FormData();
      fd.append('facility_id', String(selectedFacilityId));
      fd.append('action', 'set');
      fd.append('file', compressed.fullBlob, 'facility_photo.jpg');
      const url = `${SUPABASE_URL}/functions/v1/facility-photo-upload`;
      const res = await window.callImageFunction(url, { method: 'POST', body: fd });
      _gotResponse = true;
      let body = null;
      try { body = await res.json(); } catch (_) { /* noop */ }
      if (!res.ok) {
        const code = body && body.error;
        const rid = body && body.rid;
        if (rid) console.error('[EO-DEC-0235] facility-photo-upload error rid:', rid);
        _setMsg(_errorCode(code), '#c0392b');
        return;
      }
      _setMsg('登録しました', '#27ae60');
      _pendingFile = null;
      const inp = _input();
      if (inp) inp.value = '';
      const ub = _uploadBtn();
      if (ub) ub.style.display = 'none';
    } catch (e) {
      console.error('[EO-DEC-0235] facilityPhotoUpload exception:', e);
      if (!_gotResponse) {
        _setMsg('通信に失敗した可能性があります。プロフィール画面を開いて、写真が変わっているかご確認ください', '#c0392b');
      } else {
        _setMsg('時間をおいて再度お試しください', '#c0392b');
      }
    } finally {
      _setBusy(false);
    }
  };

  window.facilityPhotoDelete = async function () {
    if (!selectedFacilityId) { _setMsg('施設が選択されていません', '#c0392b'); return; }
    if (!window.confirm('施設写真を削除しますか？')) return;
    if (typeof window.callImageFunction !== 'function') { _setMsg('認証ヘルパーが読み込まれていません', '#c0392b'); return; }
    _setBusy(true);
    _setMsg('削除中...');
    let _gotResponse = false;
    try {
      const fd = new FormData();
      fd.append('facility_id', String(selectedFacilityId));
      fd.append('action', 'delete');
      const url = `${SUPABASE_URL}/functions/v1/facility-photo-upload`;
      const res = await window.callImageFunction(url, { method: 'POST', body: fd });
      _gotResponse = true;
      let body = null;
      try { body = await res.json(); } catch (_) { /* noop */ }
      if (!res.ok) {
        const code = body && body.error;
        const rid = body && body.rid;
        if (rid) console.error('[EO-DEC-0235] facility-photo-delete error rid:', rid);
        _setMsg(_errorCode(code), '#c0392b');
        return;
      }
      _setMsg('削除しました', '#27ae60');
      _pendingFile = null;
      const inp = _input();
      if (inp) inp.value = '';
      const ub = _uploadBtn();
      if (ub) ub.style.display = 'none';
      const pw = _previewWrap();
      if (pw) pw.style.display = 'none';
    } catch (e) {
      console.error('[EO-DEC-0235] facilityPhotoDelete exception:', e);
      if (!_gotResponse) {
        _setMsg('通信に失敗した可能性があります。プロフィール画面を開いて、写真が削除されているかご確認ください', '#c0392b');
      } else {
        _setMsg('時間をおいて再度お試しください', '#c0392b');
      }
    } finally {
      _setBusy(false);
    }
  };
}());

</script>

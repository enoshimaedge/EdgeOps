const ENV_CONFIG = {
  prod: {
    LINE_AUTH_URL: 'https://eomsdvwklntrtiiksnro.supabase.co/functions/v1/line-auth'
  },
  staging: {
    LINE_AUTH_URL: 'https://lxptelyviuucqmwxqxly.supabase.co/functions/v1/line-auth'
  },
  dev: {
    LINE_AUTH_URL: 'https://lxptelyviuucqmwxqxly.supabase.co/functions/v1/line-auth'
  }
};

function detectEnvironment() {
  const host = (typeof window !== 'undefined' && window.location && window.location.hostname) || '';
  if (host === 'app.edgeops.jp') return 'prod';
  if (host.includes('staging') || host === 'staging.edgeops.jp') return 'staging';
  if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local')) return 'dev';
  // 不明なホストは安全側で prod にフォールバック
  return 'prod';
}

const CURRENT_ENV = detectEnvironment();
const LINE_AUTH_URL = ENV_CONFIG[CURRENT_ENV].LINE_AUTH_URL;

console.log('[EdgeOps manager] Environment:', CURRENT_ENV, '| hostname:', window.location.hostname);
</script>

<script>
const SUPABASE_URL = 'https://eomsdvwklntrtiiksnro.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvbXNkdndrbG50cnRpaWtzbnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNTYyNjksImV4cCI6MjA5MjkzMjI2OX0.86F6pycMm9i6LNXv3q7uaq6hA_ePQ7BdJVQbHJM4ZOA';
const LIFF_ID = '2009827939-rZo06gWm';

// 1施設あたりのグループ数上限（Plus版の確定仕様・設計書6-4）
// ★将来プラン別上限が必要になればDB/RPCへ移す。その際もこの1か所を置き換えればよい。
const FACILITY_GROUP_LIMIT = 20;

let sb;
let managerFacilities = [];
let selectedFacilityId = null;
let managerGroups = [];
let memberCandidates = [];
let currentEoUid = null;

const screenIds = ['screen-loading', 'screen-denied', 'screen-main'];

function showScreen(screenId) {
  screenIds.forEach((id) => {
    const element = document.getElementById(id);
    if (!element) return;
    element.classList.toggle('active', id === screenId);
  });
}

function setFacilityValue(id, value) {
  const element = document.getElementById(id);
  if (!element) return;
  element.textContent = value == null ? '' : String(value);
}

function getSelectedFacility() {
  return managerFacilities.find((facility) => String(facility.facility_id) === String(selectedFacilityId)) || null;
}

function renderFacilityBanner(facility) {
  const banner = document.getElementById('facility-banner');
  if (!banner) return;
  const status = facility && facility.contract_status;
  if (status && status !== 'active') {
    banner.textContent = 'この施設の契約状態は「' + status + '」です。管理操作が制限される場合があります。';
    banner.hidden = false;
  } else {
    banner.textContent = '';
    banner.hidden = true;
  }
}

function renderFacilityDetails() {
  const facility = getSelectedFacility();
  if (!facility) return;
  setFacilityValue('facility-name', facility.facility_name);
  setFacilityValue('facility-code', facility.facility_code);
  setFacilityValue('facility-plan', facility.plan);
  setFacilityValue('facility-contract-status', facility.contract_status);
  // sub_status は表示のみ（凍結判定には使わない）
  setFacilityValue('facility-sub-status', facility.sub_status);
  setFacilityValue('facility-group-count', (facility.group_count != null ? facility.group_count : 0) + ' / ' + FACILITY_GROUP_LIMIT);
  setFacilityValue('facility-archived-count', 'アーカイブ ' + (facility.archived_count != null ? facility.archived_count : 0));
  setFacilityValue('facility-member-count', (facility.member_count != null ? facility.member_count : 0) + '人');
  setFacilityValue('facility-manager-count', (facility.manager_count != null ? facility.manager_count : 0) + '人');
  renderFacilityBanner(facility);
  renderGroupList();
  renderManagerSection();
}

const INDUSTRY_LABELS = {
  hotel: 'ホテル・旅館', commercial: '商業施設', clinic: '病院・クリニック',
  care: '介護施設', attraction: '集客施設', fitness: 'フィットネス施設',
  club: '部活・クラブ', event: 'イベント・催事'
};

function buildGroupRow(group) {
  const row = document.createElement('div');
  row.className = 'mg-group-row';

  const header = document.createElement('div');
  header.className = 'mg-group-header';

  const name = document.createElement('span');
  name.className = 'mg-group-name';
  name.textContent = group.group_name || '';
  header.appendChild(name);

  const industry = document.createElement('span');
  industry.className = 'mg-group-industry';
  industry.textContent = INDUSTRY_LABELS[group.industry] || group.industry || '';
  header.appendChild(industry);

  row.appendChild(header);

  const gid = document.createElement('div');
  gid.className = 'mg-group-gid';
  gid.textContent = group.group_id || '';
  row.appendChild(gid);

  const meta = document.createElement('div');
  meta.className = 'mg-group-meta';
  let metaText = '👥 ' + (group.member_count != null ? group.member_count : 0) + '人';
  if (group.signage_count) {
    metaText += '  📺 ' + group.signage_count + '台';
  }
  const creators = Array.isArray(group.creator_names) && group.creator_names.length > 0
    ? group.creator_names.join('、') : 'なし';
  metaText += '   管理者: ' + creators;
  meta.textContent = metaText;
  row.appendChild(meta);

  return row;
}

function renderGroupList() {
  const container = document.getElementById('group-list-container');
  if (!container) return;
  container.replaceChildren();

  const facilityGroups = managerGroups.filter((g) => String(g.facility_id) === String(selectedFacilityId));
  const active = facilityGroups.filter((g) => g.archived_at == null);
  const archived = facilityGroups.filter((g) => g.archived_at != null);

  const title = document.createElement('div');
  title.className = 'mg-group-card-title';
  title.textContent = 'グループ一覧';
  container.appendChild(title);

  if (facilityGroups.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'mg-group-empty';
    empty.textContent = 'この施設にはまだグループがありません';
    container.appendChild(empty);
    return;
  }

  const list = document.createElement('div');
  list.className = 'mg-group-list';
  active.forEach((group) => list.appendChild(buildGroupRow(group)));
  if (active.length > 0) {
    container.appendChild(list);
  }

  if (archived.length > 0) {
    const details = document.createElement('details');
    details.className = 'mg-archived';

    const summary = document.createElement('summary');
    summary.className = 'mg-archived-summary';
    summary.textContent = 'アーカイブ済み（' + archived.length + '）';
    details.appendChild(summary);

    const archivedList = document.createElement('div');
    archivedList.className = 'mg-archived-list';
    archived.forEach((group) => {
      const row = buildGroupRow(group);
      const archivedAt = document.createElement('div');
      archivedAt.className = 'mg-group-archived-at';
      archivedAt.textContent = 'アーカイブ日時: ' + new Date(group.archived_at).toLocaleString('ja-JP');
      row.appendChild(archivedAt);
      archivedList.appendChild(row);
    });
    details.appendChild(archivedList);
    container.appendChild(details);
  }

  const note = document.createElement('div');
  note.className = 'mg-group-note';
  note.textContent = 'グループごとの管理操作は Batch4-⑤ で実装します';
  container.appendChild(note);
}

/* ─────────────────────────────────────────────────────────
   サブ管理者管理セクション（Batch4-④）
──────────────────────────────────────────────────────── */

const MANAGER_ERROR_MESSAGES = {
  LAST_MANAGER_CANNOT_BE_REMOVED: '施設の管理者が0人になるため、この操作はできません',
  ALREADY_MANAGER: 'この方はすでに施設管理者です',
  TARGET_NOT_APPROVED_MEMBER: 'この方は施設のグループに参加していないため追加できません',
  NOT_FACILITY_MANAGER: '権限がありません',
};

function managerErrorMessage(error) {
  if (!error) return '処理できませんでした。時間をおいて再度お試しください';
  const code = (error.code || error.message || '');
  for (const key of Object.keys(MANAGER_ERROR_MESSAGES)) {
    if (code.includes(key)) return MANAGER_ERROR_MESSAGES[key];
  }
  return '処理できませんでした。時間をおいて再度お試しください';
}

function renderManagerSection() {
  const container = document.getElementById('manager-section-container');
  if (!container) return;
  container.replaceChildren();

  const facility = getSelectedFacility();
  if (!facility) return;

  const section = document.createElement('div');
  section.className = 'mg-manager-section';

  // ── 現在の管理者一覧 ──
  const currentCard = document.createElement('div');
  currentCard.className = 'mg-manager-card';

  const currentTitle = document.createElement('div');
  currentTitle.className = 'mg-manager-card-title';
  currentTitle.textContent = '施設管理者';
  currentCard.appendChild(currentTitle);

  const currentErrorEl = document.createElement('div');
  currentErrorEl.className = 'mg-manager-error';
  currentErrorEl.hidden = true;
  currentCard.appendChild(currentErrorEl);

  const managers = memberCandidates.filter(
    (c) => String(c.out_facility_id) === String(selectedFacilityId) && c.out_is_manager
  );

  if (managers.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'mg-manager-empty';
    empty.textContent = '管理者情報がありません';
    currentCard.appendChild(empty);
  } else {
    const list = document.createElement('div');
    list.className = 'mg-manager-list';
    managers.forEach((mgr) => {
      const row = document.createElement('div');
      row.className = 'mg-manager-row';

      const info = document.createElement('div');
      info.className = 'mg-manager-info';

      const nameEl = document.createElement('span');
      nameEl.className = 'mg-manager-name';
      const displayNames = Array.isArray(mgr.out_display_names) ? mgr.out_display_names : [];
      nameEl.textContent = displayNames.join(' / ') || '（名前なし）';
      info.appendChild(nameEl);

      if (currentEoUid && mgr.out_eo_uid === currentEoUid) {
        const selfBadge = document.createElement('span');
        selfBadge.className = 'mg-manager-self-badge';
        selfBadge.textContent = '（あなた）';
        nameEl.appendChild(selfBadge);
      }

      row.appendChild(info);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'mg-manager-btn';
      removeBtn.textContent = '削除';
      removeBtn.dataset.eoUid = mgr.out_eo_uid;
      removeBtn.dataset.displayName = displayNames.join(' / ') || '';
      removeBtn.addEventListener('click', () => {
        removeFacilityManager(
          removeBtn,
          currentErrorEl,
          String(facility.facility_id),
          mgr.out_eo_uid,
          displayNames.join(' / ') || ''
        );
      });
      row.appendChild(removeBtn);

      list.appendChild(row);
    });
    currentCard.appendChild(list);
  }

  section.appendChild(currentCard);

  // ── 管理者候補リスト ──
  const candidateCard = document.createElement('div');
  candidateCard.className = 'mg-manager-card';

  const candidateTitle = document.createElement('div');
  candidateTitle.className = 'mg-manager-card-title';
  candidateTitle.textContent = '管理者候補';
  candidateCard.appendChild(candidateTitle);

  const candidateErrorEl = document.createElement('div');
  candidateErrorEl.className = 'mg-manager-error';
  candidateErrorEl.hidden = true;
  candidateCard.appendChild(candidateErrorEl);

  const candidates = memberCandidates.filter(
    (c) => String(c.out_facility_id) === String(selectedFacilityId) && !c.out_is_manager
  );

  if (candidates.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'mg-manager-empty';
    empty.textContent = '追加できる候補者はいません';
    candidateCard.appendChild(empty);
  } else {
    const list = document.createElement('div');
    list.className = 'mg-manager-list';
    candidates.forEach((c) => {
      const row = document.createElement('div');
      row.className = 'mg-manager-row';

      const info = document.createElement('div');
      info.className = 'mg-manager-info';

      const nameEl = document.createElement('div');
      nameEl.className = 'mg-manager-name';
      const displayNames = Array.isArray(c.out_display_names) ? c.out_display_names : [];
      nameEl.textContent = displayNames.join(' / ') || '（名前なし）';
      info.appendChild(nameEl);

      const groupsEl = document.createElement('div');
      groupsEl.className = 'mg-manager-groups';
      const groupNames = Array.isArray(c.out_group_names) ? c.out_group_names : [];
      groupsEl.textContent = groupNames.join('、') || '';
      info.appendChild(groupsEl);

      row.appendChild(info);

      if (c.out_is_manager) {
        const addedLabel = document.createElement('span');
        addedLabel.className = 'mg-manager-added-label';
        addedLabel.textContent = '追加済み';
        row.appendChild(addedLabel);
      } else {
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'mg-manager-btn mg-manager-btn-add';
        addBtn.textContent = '追加';
        addBtn.dataset.eoUid = c.out_eo_uid;
        addBtn.addEventListener('click', () => {
          addFacilityManager(
            addBtn,
            candidateErrorEl,
            String(facility.facility_id),
            c.out_eo_uid
          );
        });
        row.appendChild(addBtn);
      }

      list.appendChild(row);
    });
    candidateCard.appendChild(list);
  }

  section.appendChild(candidateCard);
  container.appendChild(section);
}

async function reloadManagerData() {
  const { data: facilityData, error: facilityError } = await sb.rpc('manager_get_my_facilities');
  if (!facilityError && Array.isArray(facilityData)) {
    managerFacilities = facilityData;
  }
  const { data: candidateData, error: candidateError } = await sb.rpc('manager_list_member_candidates');
  if (!candidateError && Array.isArray(candidateData)) {
    memberCandidates = candidateData;
  }
}

async function addFacilityManager(btn, errorEl, facilityId, eoUid) {
  btn.disabled = true;
  errorEl.hidden = true;
  try {
    const { error } = await sb.rpc('manager_add_facility_manager', {
      p_facility_id: facilityId,
      p_new_eo_uid: eoUid,
    });
    if (error) {
      errorEl.textContent = managerErrorMessage(error);
      errorEl.hidden = false;
      btn.disabled = false;
      return;
    }
    await reloadManagerData();
    renderManagerSection();
  } catch (e) {
    errorEl.textContent = managerErrorMessage(e);
    errorEl.hidden = false;
    btn.disabled = false;
  }
}

async function removeFacilityManager(btn, errorEl, facilityId, eoUid, displayName) {
  const isSelf = currentEoUid && eoUid === currentEoUid;
  if (isSelf) {
    const confirmed = window.confirm(
      '自分を施設管理者から外すと、この施設の管理画面を利用できなくなります。よろしいですか？'
    );
    if (!confirmed) return;
  } else {
    const confirmed = window.confirm(displayName + ' を施設管理者から削除しますか？');
    if (!confirmed) return;
  }

  btn.disabled = true;
  errorEl.hidden = true;
  try {
    const { error } = await sb.rpc('manager_remove_facility_manager', {
      p_facility_id: facilityId,
      p_target_eo_uid: eoUid,
    });
    if (error) {
      errorEl.textContent = managerErrorMessage(error);
      errorEl.hidden = false;
      btn.disabled = false;
      return;
    }
    if (isSelf) {
      // 自分を外した場合は権限がなくなるため denied 画面へ
      await reloadManagerData();
      showScreen('screen-denied');
      return;
    }
    await reloadManagerData();
    renderManagerSection();
  } catch (e) {
    errorEl.textContent = managerErrorMessage(e);
    errorEl.hidden = false;
    btn.disabled = false;
  }
}

function renderFacilitySelect() {
  const select = document.getElementById('facility-select');
  if (!select) return;
  select.replaceChildren();
  managerFacilities.forEach((facility) => {
    const option = document.createElement('option');
    option.value = String(facility.facility_id);
    option.textContent = facility.facility_name == null ? '' : String(facility.facility_name);
    select.appendChild(option);
  });
  select.value = String(selectedFacilityId);
  renderFacilityDetails();
}

async function init() {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (error) {
    console.error('[manager.html] liff.init failed:', error);
    showScreen('screen-denied');
    return;
  }

  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: window.location.href });
    return;
  }

  // ★auth.js の getCurrentFacility() / getCurrentRole() は使わない。
  //   facility_managers を直接SELECTしており、第189回（EO-DEC-0189）の
  //   GRANT剥奪後は成立しない。施設判定は manager_get_my_facilities() RPC を使う。
  try {
    const authResult = await resolveEoUid(sb);
    if (!authResult || !authResult.eoUid) {
      throw new Error('resolveEoUid returned no eoUid');
    }
    currentEoUid = authResult.eoUid;
  } catch (error) {
    console.error('[manager.html] resolveEoUid failed:', error);
    try {
      liff.logout();
    } catch (_) {}
    liff.login({ redirectUri: window.location.href });
    return;
  }

  const { data, error } = await sb.rpc('manager_get_my_facilities');
  if (error) {
    console.error('[manager.html] manager_get_my_facilities error:', error);
    showScreen('screen-denied');
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    console.warn('[manager.html] manager_get_my_facilities returned 0 rows.');
    showScreen('screen-denied');
    return;
  }

  managerFacilities = data;
  selectedFacilityId = String((managerFacilities.find((facility) => facility && facility.is_main) || managerFacilities[0]).facility_id);

  const { data: groupData, error: groupError } = await sb.rpc('manager_list_groups');
  if (groupError) {
    console.error('[manager.html] manager_list_groups error:', groupError);
  } else if (Array.isArray(groupData)) {
    managerGroups = groupData;
  }

  const { data: candidateData, error: candidateError } = await sb.rpc('manager_list_member_candidates');
  if (candidateError) {
    console.warn('[manager.html] manager_list_member_candidates error:', candidateError);
  } else if (Array.isArray(candidateData)) {
    memberCandidates = candidateData;
  }

  renderFacilitySelect();
  showScreen('screen-main');
}

async function managerLogout() {
  // ① 画面上のデータを先に消す（一瞬でも他人に見せない）
  managerFacilities = [];
  managerGroups = [];
  memberCandidates = [];
  selectedFacilityId = null;
  currentEoUid = null;
  setFacilityValue('facility-name', '');
  setFacilityValue('facility-code', '');
  setFacilityValue('facility-plan', '');
  setFacilityValue('facility-contract-status', '');
  setFacilityValue('facility-sub-status', '');
  setFacilityValue('facility-group-count', '');
  setFacilityValue('facility-archived-count', '');
  setFacilityValue('facility-member-count', '');
  setFacilityValue('facility-manager-count', '');
  const bannerEl = document.getElementById('facility-banner');
  if (bannerEl) { bannerEl.textContent = ''; bannerEl.hidden = true; }
  const select = document.getElementById('facility-select');
  if (select) select.replaceChildren();
  showScreen('screen-loading');

  // ② Supabase セッション終了 ＋ EdgeOps 認証キャッシュ消去
  try {
    await clearAuthCache(sb);
  } catch (e) {
    console.warn('[manager.html] clearAuthCache failed (continue):', e);
  }

  // ③ sessionStorage のトークンを明示的に消す
  try {
    sessionStorage.removeItem('edgeops_access_token');
    sessionStorage.removeItem('edgeops_refresh_token');
  } catch (e) {
    console.warn('[manager.html] sessionStorage clear failed (continue):', e);
  }

  // ④ LINE のログアウト（最後）
  try {
    liff.logout();
  } catch (e) {
    console.warn('[manager.html] liff.logout failed (continue):', e);
  }

  // ⑤ 認証前の状態へ戻す（再読み込み）
  window.location.replace(window.location.pathname);
}

const facilitySelectElement = document.getElementById('facility-select');
if (facilitySelectElement) {
  facilitySelectElement.addEventListener('change', (event) => {
    selectedFacilityId = event.target.value;
    renderFacilityDetails();
  });
}

init().catch((error) => {
  console.error('[manager.html] init failed unexpectedly:', error);
  showScreen('screen-denied');
});
</script>

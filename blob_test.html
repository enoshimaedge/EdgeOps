<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blobダウンロード実機確認（第246回 論点C）</title>
<style>
  body { font-family: "Yu Gothic", "游ゴシック", sans-serif; margin: 16px; line-height: 1.7; font-size: 15px; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  button { font-size: 16px; padding: 12px 16px; width: 100%; margin: 8px 0; border: 1px solid #333; border-radius: 6px; background: #fff; }
  #log { white-space: pre-wrap; word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  .q { background: #fffbe6; border: 1px solid #e0c000; padding: 10px; border-radius: 6px; margin-top: 12px; }
</style>
</head>
<body>
<h1>Blobダウンロード実機確認（第246回 論点C）</h1>
<p>この画面を <b>LINEアプリ内</b>で開いて、下の2つのボタンを押してください。</p>

<button id="btn1">① 小さなCSVをダウンロードする（本命）</button>
<button id="btn2">② 小さなZIP相当（バイナリBlob）をダウンロードする</button>

<div class="q">
<b>判定のしかた</b><br>
・保存された／「ダウンロードしました」等の表示が出た → <b>成立＝案ア</b>（どこでも実行可。LINE内では「PCブラウザ推奨」を出すだけ）<br>
・何も起きない／別画面が開いて終わる／エラー → <b>不成立＝PCブラウザ限定</b>（<code>liff.isInClient()</code> が真のときボタンを disabled）
</div>

<div id="log">環境情報を取得中…</div>

<script>
(function () {
  var log = document.getElementById('log');
  function w(s) { log.textContent += "\n" + s; }

  var info = [];
  info.push("URL: " + location.href);
  info.push("UA: " + navigator.userAgent);
  info.push("LINE内か(UAにLine/): " + (/\bLine\//i.test(navigator.userAgent)));
  info.push("Blob対応: " + (typeof Blob !== "undefined"));
  info.push("createObjectURL対応: " + !!(window.URL && URL.createObjectURL));
  info.push("aタグ download 属性対応: " + ("download" in document.createElement("a")));
  info.push("msSaveBlob: " + !!(navigator.msSaveBlob));
  log.textContent = info.join("\n");

  function download(blob, name) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      w("→ click() を実行しました（" + name + " / " + blob.size + " バイト）。端末に保存されたかを確認してください。");
    } catch (e) {
      w("→ ★例外: " + e);
    }
  }

  document.getElementById("btn1").onclick = function () {
    // UTF-8 BOM + CRLF + 日本語（本番のCSVと同じ条件）
    var csv = "﻿" + "message_id,group_id,body\r\n1,SL-TEST,\"改行,カンマを含む本文\"\r\n2,SL-TEST,日本語のテスト\r\n";
    download(new Blob([csv], { type: "text/csv;charset=utf-8" }), "edgeops_blob_test.csv");
  };

  document.getElementById("btn2").onclick = function () {
    var bytes = new Uint8Array(1024);
    for (var i = 0; i < bytes.length; i++) { bytes[i] = i % 256; }
    download(new Blob([bytes], { type: "application/zip" }), "edgeops_blob_test.zip");
  };
})();
</script>
</body>
</html>
